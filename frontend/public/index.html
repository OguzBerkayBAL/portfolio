<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030703" />
    <meta name="description" content="Oğuz Berkay BAL — Full Stack Developer. TypeScript, NestJS, React, React Native ve PostgreSQL ile web ve mobil ürünler." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap"

    <style>
        body {
            margin: 0;
            background: #030703;
            overflow-x: hidden;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030703;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut .6s ease-in-out 1.2s forwards;
        }

        .loading-text {
            font-family: 'JetBrains Mono', monospace;
            color: #00ff41;
            font-size: 1.5rem;
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 6px rgba(0,255,65,.6);
            }

            to {
                text-shadow: 0 0 12px rgba(0,255,65,.8);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>

<body>
    <noscript>Bu uygulama JavaScript gerektirir.</noscript>
    <div class="loading-screen">
        <div class="loading-text">wake up, neo...</div>
    </div>
    <div id="root"></div>
</body>

</html>
